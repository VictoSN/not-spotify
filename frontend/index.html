<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>not-spotify</title>
    <!-- PWA: installable + theming -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="not-spotify" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Apply theme before paint to avoid a flash of the wrong theme.
         A saved choice wins; otherwise fall back to the device's setting so
         guests open in their system light/dark mode (bug 21). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ns-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          } else {
            document.documentElement.dataset.theme =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
