<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" role="img" font-family="'Circular Std','Gotham',Arial,Helvetica,sans-serif">
  <title>Not Spotify desktop app — Home screen</title>
  <defs>
    <linearGradient id="pgBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.35" stop-color="#181818"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="aGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ed760"/><stop offset="1" stop-color="#0d5c2a"/></linearGradient>
    <linearGradient id="aPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b1f6e"/></linearGradient>
    <linearGradient id="aBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="aPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#7f1d3a"/></linearGradient>
    <linearGradient id="aOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="aTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
    <linearGradient id="avatarG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ed760"/><stop offset="1" stop-color="#155e34"/></linearGradient>
  </defs>

  <!-- App canvas -->
  <rect width="1024" height="640" fill="#000000"/>

  <!-- ── Left sidebar ─────────────────────────────────── -->
  <rect x="0" y="0" width="236" height="584" fill="#000000"/>
  <g transform="translate(20,26)">
    <!-- library header -->
    <rect x="0" y="0" width="18" height="14" rx="2" fill="#b3b3b3"/>
    <rect x="0" y="4" width="18" height="2.4" fill="#000"/>
    <rect x="0" y="8.5" width="18" height="2.4" fill="#000"/>
    <text x="28" y="12" fill="#b3b3b3" font-size="14" font-weight="700">Your Library</text>
    <text x="196" y="12" fill="#b3b3b3" font-size="18" font-weight="700">+</text>
  </g>
  <!-- filter chips -->
  <g transform="translate(20,58)" font-size="11" font-weight="600">
    <rect x="0" y="0" width="66" height="24" rx="12" fill="#232323"/><text x="14" y="16" fill="#fff">Playlists</text>
    <rect x="74" y="0" width="56" height="24" rx="12" fill="#232323"/><text x="86" y="16" fill="#fff">Artists</text>
  </g>

  <!-- playlist rows -->
  <g transform="translate(12,96)">
    <!-- row template: 40 art + two lines -->
    <g transform="translate(0,0)">
      <rect width="40" height="40" rx="6" fill="url(#aGreen)"/>
      <path d="M18 12 v14 a4 4 0 1 1 -3 -3.8 V16 l9 -2 v9 a4 4 0 1 1 -3 -3.8 V12 z" fill="#0a3d1e" transform="translate(4,3) scale(0.7)"/>
      <text x="52" y="18" fill="#ffffff" font-size="13.5" font-weight="600">Liked Songs</text>
      <text x="52" y="33" fill="#9a9a9a" font-size="11">Playlist · 248 songs</text>
    </g>
    <g transform="translate(0,56)">
      <rect width="40" height="40" rx="6" fill="url(#aPurple)"/>
      <text x="52" y="18" fill="#ffffff" font-size="13.5" font-weight="600">Chill Vibes</text>
      <text x="52" y="33" fill="#9a9a9a" font-size="11">Playlist · Ankara</text>
    </g>
    <g transform="translate(0,112)">
      <rect width="40" height="40" rx="6" fill="url(#aBlue)"/>
      <text x="52" y="18" fill="#ffffff" font-size="13.5" font-weight="600">Focus Flow</text>
      <text x="52" y="33" fill="#9a9a9a" font-size="11">Playlist · 92 songs</text>
    </g>
    <g transform="translate(0,168)">
      <rect width="40" height="40" rx="20" fill="url(#aOrange)"/>
      <text x="52" y="18" fill="#ffffff" font-size="13.5" font-weight="600">Vela</text>
      <text x="52" y="33" fill="#9a9a9a" font-size="11">Artist</text>
    </g>
    <g transform="translate(0,224)">
      <rect width="40" height="40" rx="6" fill="url(#aPink)"/>
      <text x="52" y="18" fill="#ffffff" font-size="13.5" font-weight="600">Late Night</text>
      <text x="52" y="33" fill="#9a9a9a" font-size="11">Playlist · 61 songs</text>
    </g>
    <g transform="translate(0,280)">
      <rect width="40" height="40" rx="6" fill="url(#aTeal)"/>
      <text x="52" y="18" fill="#ffffff" font-size="13.5" font-weight="600">Workout</text>
      <text x="52" y="33" fill="#9a9a9a" font-size="11">Playlist · 40 songs</text>
    </g>
  </g>

  <!-- ── Main panel ───────────────────────────────────── -->
  <rect x="236" y="0" width="788" height="584" rx="10" fill="url(#pgBg)"/>

  <!-- top bar -->
  <rect x="236" y="0" width="788" height="56" rx="10" fill="#101010" opacity="0.85"/>
  <circle cx="266" cy="28" r="14" fill="#0a0a0a"/><path d="M269 22 l-5 6 l5 6" fill="none" stroke="#e5e5e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="302" cy="28" r="14" fill="#0a0a0a"/><path d="M299 22 l5 6 l-5 6" fill="none" stroke="#8a8a8a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="330" y="13" width="320" height="30" rx="15" fill="#242424"/>
  <circle cx="349" cy="28" r="6.5" fill="none" stroke="#b3b3b3" stroke-width="2"/><line x1="354" y1="33" x2="359" y2="38" stroke="#b3b3b3" stroke-width="2" stroke-linecap="round"/>
  <text x="368" y="32" fill="#a7a7a7" font-size="12.5">What do you want to play?</text>
  <circle cx="994" cy="28" r="15" fill="url(#avatarG)"/><text x="994" y="33" fill="#04240f" font-size="14" font-weight="800" text-anchor="middle">A</text>

  <!-- greeting -->
  <text x="264" y="102" fill="#ffffff" font-size="26" font-weight="800">Good evening</text>

  <!-- quick-pick tiles (2 rows x 3) -->
  <g font-weight="700" font-size="13" fill="#ffffff">
    <!-- row 1 -->
    <g transform="translate(264,120)"><rect width="232" height="56" rx="6" fill="#ffffff" opacity="0.09"/><rect width="56" height="56" rx="6" fill="url(#aGreen)"/><text x="72" y="32">Liked Songs</text></g>
    <g transform="translate(512,120)"><rect width="232" height="56" rx="6" fill="#ffffff" opacity="0.09"/><rect width="56" height="56" rx="6" fill="url(#aPurple)"/><text x="72" y="32">Daily Mix 1</text></g>
    <g transform="translate(760,120)"><rect width="232" height="56" rx="6" fill="#ffffff" opacity="0.09"/><rect width="56" height="56" rx="6" fill="url(#aBlue)"/><text x="72" y="32">Discover Weekly</text></g>
    <!-- row 2 -->
    <g transform="translate(264,188)"><rect width="232" height="56" rx="6" fill="#ffffff" opacity="0.09"/><rect width="56" height="56" rx="6" fill="url(#aPink)"/><text x="72" y="32">Release Radar</text></g>
    <g transform="translate(512,188)"><rect width="232" height="56" rx="6" fill="#ffffff" opacity="0.09"/><rect width="56" height="56" rx="6" fill="url(#aOrange)"/><text x="72" y="32">Chill Hits</text></g>
    <g transform="translate(760,188)"><rect width="232" height="56" rx="6" fill="#ffffff" opacity="0.09"/><rect width="56" height="56" rx="6" fill="url(#aTeal)"/><text x="72" y="32">On Repeat</text></g>
  </g>

  <!-- section header -->
  <text x="264" y="286" fill="#ffffff" font-size="19" font-weight="800">Made for you</text>
  <text x="978" y="286" fill="#b3b3b3" font-size="11.5" font-weight="700" text-anchor="end">Show all</text>

  <!-- album card row -->
  <g>
    <g transform="translate(264,304)"><rect width="134" height="134" rx="8" fill="url(#aPurple)"/><circle cx="107" cy="107" r="16" fill="#1ed760"/><path d="M103 100 v14 l11 -7 z" fill="#04240f"/><text x="0" y="156" fill="#ffffff" font-size="13" font-weight="700">Daily Mix 1</text><text x="0" y="174" fill="#9a9a9a" font-size="11">Vela, Aurora and more</text></g>
    <g transform="translate(414,304)"><rect width="134" height="134" rx="8" fill="url(#aBlue)"/><text x="0" y="156" fill="#ffffff" font-size="13" font-weight="700">Daily Mix 2</text><text x="0" y="174" fill="#9a9a9a" font-size="11">Nyx, Orion and more</text></g>
    <g transform="translate(564,304)"><rect width="134" height="134" rx="8" fill="url(#aGreen)"/><text x="0" y="156" fill="#ffffff" font-size="13" font-weight="700">Discover Weekly</text><text x="0" y="174" fill="#9a9a9a" font-size="11">Your weekly mixtape</text></g>
    <g transform="translate(714,304)"><rect width="134" height="134" rx="8" fill="url(#aPink)"/><text x="0" y="156" fill="#ffffff" font-size="13" font-weight="700">On Repeat</text><text x="0" y="174" fill="#9a9a9a" font-size="11">Songs you love</text></g>
    <g transform="translate(864,304)"><rect width="128" height="134" rx="8" fill="url(#aOrange)"/><text x="0" y="156" fill="#ffffff" font-size="13" font-weight="700">Time Capsule</text><text x="0" y="174" fill="#9a9a9a" font-size="11">A trip to your past</text></g>
  </g>

  <!-- ── Now-playing bar ──────────────────────────────── -->
  <rect x="0" y="584" width="1024" height="56" fill="#181818"/>
  <rect x="0" y="584" width="1024" height="1.5" fill="#2a2a2a"/>
  <!-- left: track -->
  <rect x="14" y="594" width="40" height="40" rx="5" fill="url(#aTeal)"/>
  <text x="64" y="609" fill="#ffffff" font-size="12.5" font-weight="600">Neon Horizon</text>
  <text x="64" y="625" fill="#9a9a9a" font-size="10.5">Vela</text>
  <path d="M214 608 a5 5 0 0 1 8 -3 a5 5 0 0 1 8 3 c0 4 -8 9 -8 9 s-8 -5 -8 -9 z" fill="none" stroke="#1ed760" stroke-width="1.6"/>
  <!-- center: controls -->
  <g stroke="#e8e8e8" stroke-width="1.7" fill="#e8e8e8" stroke-linecap="round" stroke-linejoin="round">
    <!-- shuffle -->
    <g fill="none">
      <path d="M446 603 h4 l10 10 h4 M446 613 h4 l10 -10 h4"/>
      <path d="M461 610 l4 3 -4 3 M461 597 l4 3 -4 3"/>
    </g>
    <!-- previous -->
    <path d="M476 601 v14 M490 601 v14 l-10 -7 z"/>
    <!-- play -->
    <circle cx="512" cy="608" r="15" fill="#ffffff" stroke="none"/>
    <path d="M507 601 v14 l12 -7 z" fill="#000000" stroke="none"/>
    <!-- next -->
    <path d="M534 601 v14 l10 -7 z M548 601 v14"/>
    <!-- repeat -->
    <g fill="none">
      <path d="M564 604 h10 a4 4 0 0 1 4 4 v1"/>
      <path d="M580 601 l3 3 -3 3"/>
      <path d="M576 613 h-10 a4 4 0 0 1 -4 -4 v-1"/>
      <path d="M560 611 l-3 -3 3 -3"/>
    </g>
  </g>
  <!-- progress -->
  <text x="404" y="612" fill="#9a9a9a" font-size="9.5">1:24</text>
  <rect x="430" y="626" width="164" height="3" rx="1.5" fill="#4d4d4d"/>
  <rect x="430" y="626" width="66" height="3" rx="1.5" fill="#1ed760"/>
  <circle cx="496" cy="627.5" r="4" fill="#ffffff"/>
  <text x="600" y="612" fill="#9a9a9a" font-size="9.5">3:57</text>
  <!-- right: volume -->
  <path d="M918 606 l6 -4 v14 l-6 -4 h-4 v-2 z" fill="#b3b3b3"/>
  <path d="M927 604 a6 6 0 0 1 0 12 M930 601 a10 10 0 0 1 0 18" fill="none" stroke="#b3b3b3" stroke-width="1.5"/>
  <rect x="946" y="608" width="60" height="3" rx="1.5" fill="#4d4d4d"/>
  <rect x="946" y="608" width="38" height="3" rx="1.5" fill="#b3b3b3"/>
  <circle cx="984" cy="609.5" r="4" fill="#ffffff"/>
</svg>
