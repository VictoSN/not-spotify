[package]
name = "not-spotify-desktop"
version = "0.7.7"
description = "not-spotify desktop wrapper (Tauri shell around the PWA)"
authors = ["not-spotify team"]
edition = "2021"
rust-version = "1.77.2"

# The desktop entry point lives in `lib.rs` (shared with the mobile entry point)
# so `main.rs` stays a thin launcher; this is the layout `tauri init` produces.
[lib]
name = "not_spotify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: drive the toast API directly so notifications can show the
# sender's avatar. The high-level notification plugin only sets notify-rust's
# `icon` field, which is ignored on Windows (only `image_path`/the raw toast
# `<image>` renders), so we bypass it for the image case.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

# Smaller, faster release binaries — this is a thin webview shell, not hot code.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
